# ============================================================================
# Keep-Alive Workflow
# ============================================================================
# Purpose: Prevent Supabase Free Tier from pausing due to inactivity
# Schedule: Every 48 hours (well under the 7-day inactivity limit)
# Action: Sends a POST request to /api/system/pulse endpoint
# ============================================================================

name: Keep-Alive Pulse

on:
  # Scheduled trigger: every 48 hours
  # Cron syntax: minute hour day-of-month month day-of-week
  # '0 */48 * * *' doesn't work as expected, so we use every 2 days at midnight
  schedule:
    - cron: '0 0 */2 * *'  # At 00:00 every 2nd day
  
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual health check'

env:
  # The deployed URL of your Vercel app
  # This should be your production domain (e.g., https://your-app.vercel.app)
  PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

jobs:
  pulse:
    name: Send Keep-Alive Pulse
    runs-on: ubuntu-latest
    
    steps:
      # ======================================================================
      # Step 1: Log start time
      # ======================================================================
      - name: Log pulse start
        run: |
          echo "🏥 Keep-Alive Pulse Started"
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Trigger: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Reason: ${{ github.event.inputs.reason }}"
          fi

      # ======================================================================
      # Step 2: Send pulse request to API
      # ======================================================================
      - name: Send pulse to API
        id: pulse
        run: |
          echo "📡 Sending pulse to ${{ env.PRODUCTION_URL }}/api/system/pulse"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ env.PRODUCTION_URL }}/api/system/pulse")
          
          # Extract HTTP status code (last line)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          # Extract response body (everything except last line)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          # Set outputs for subsequent steps
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "response=$BODY" >> $GITHUB_OUTPUT
          
          # Fail if not 200
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Pulse failed with status $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Pulse successful!"

      # ======================================================================
      # Step 3: Log success
      # ======================================================================
      - name: Log pulse success
        if: success()
        run: |
          echo "🎉 Keep-Alive Pulse Completed Successfully"
          echo "Response: ${{ steps.pulse.outputs.response }}"
          echo "Next pulse scheduled in ~48 hours"

      # ======================================================================
      # Step 4: Handle failure (optional notification)
      # ======================================================================
      - name: Handle failure
        if: failure()
        run: |
          echo "⚠️ Keep-Alive Pulse FAILED"
          echo "HTTP Code: ${{ steps.pulse.outputs.http_code }}"
          echo "Response: ${{ steps.pulse.outputs.response }}"
          echo ""
          echo "⚠️ WARNING: If pulses continue to fail, Supabase may pause the project!"
          echo "Please check:"
          echo "  1. PRODUCTION_URL secret is correctly set"
          echo "  2. CRON_SECRET matches the one in Vercel environment variables"
          echo "  3. The /api/system/pulse endpoint is deployed and accessible"
